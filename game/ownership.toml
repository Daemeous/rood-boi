# Battle's main loop and its per-frame function sit at the vsync, where snapshots, rewind and the hot-reload
# host cut the stack. The development host's Zig below them is a reloadable library: a saved or rewound stack
# must not hold return addresses into it (game_host.inc). So these two are resident: in the development build
# they stay in the host's own object, and call the library through the routes below them, which return before
# the vsync.
[subsystem.battle_frame]
overlay = "battle"
unit = "pc/src/game/BATTLE/BATTLE.PRG/146C.c"
resident = true
functions = [
    { addr = 0x800798A4, name = "vs_battle_exec", zig = "battle_exec.battleExec" },  # battle's main loop
    { addr = 0x8007629C, name = "vs_render_presentFieldFrame", zig = "vs_render_presentFieldFrame.vs_render_presentFieldFrame" },
]

