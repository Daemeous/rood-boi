unit = "src/BATTLE/BATTLE.PRG/146C.c"
default = "original"
roots = ["vs_battle_actors", "vs_main_scoredata"]
functions = [
    { addr = 0x8006C004, name = "_updateEnemyKills", zig = "score.updateEnemyKills" },  # a defeated enemy's kills, streak, flags
]

[subsystem.battle_146C.views]
types = ["vs_battle_actor", "vs_battle_actor2", "vs_main_scoredata_t"]
globals = ["vs_main_scoredata"]

