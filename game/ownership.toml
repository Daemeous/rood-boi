# The game's Zig (game/): the original functions it implements, keyed by their PS1 address; the name is checked
# against the reference ELFs, so an upstream rename fails the build. Each function is exported from its Zig
# function under the original's name, so C reaches the Zig directly.
#
#   overlay   the Zig object that implements it: game/<overlay>/root.zig -> <overlay>_zig.o
#   unit      the unit the functions came from; its object supplies the views below
#   resident  stays in the host in the development build: it sits at the vsync, where snapshots, rewind and the
#             reload cut the stack, so it is not part of the reloadable library (pc/src/game_host.inc)

# The first ports: one subsystem per original unit, the Zig function named by meaning
# (PORTING.md §16) and its views per unit.
[subsystem.battle_146C]
overlay = "battle"
unit = "pc/src/game/BATTLE/BATTLE.PRG/146C.c"
functions = [
    { addr = 0x8006C004, name = "_updateEnemyKills", zig = "score.updateEnemyKills" },  # a defeated enemy's kills, streak, flags
]

