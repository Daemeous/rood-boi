# Owned game code (pc/docs/Ownership.md). Each subsystem is a set of the
# original's functions that the PC game can run from owned code (game/)
# instead. Functions are keyed by their PS1 address; the name is checked
# against the reference ELFs, so an upstream rename fails the build.
#
#   overlay   the Zig object that implements it: game/<overlay>/root.zig -> <overlay>_zig.o
#   unit      the original unit that defines every listed function
#   default   who runs it unless ROOD_OWNER, RPC owner or the overlay says otherwise:
#             original | owned
#   roots     pointer globals the field mapper follows (pc/tools/field_map.py), or
#             TYPE@ADDRESS for a block the code addresses by number (the scratchpad)

[subsystem.battle_action]
overlay = "battle"
unit = "src/BATTLE/BATTLE.PRG/146C.c"
default = "original"
roots = ["D_800F19CC", "vs_battle_actors", "D_800F4538", "vs_battle_characterState"]
functions = [
    { addr = 0x80070F28, name = "func_80070F28" },            # commit (costs, hits rolled), sets phase 4
    { addr = 0x8007138C, name = "func_8007138C" },            # cast start: animation, sound, effect request
    { addr = 0x800784AC, name = "_handleCombatCameraZoom" },  # phase 4: the camera converges
    { addr = 0x80078748, name = "func_80078748" },            # phase 5: wait for the cast to be ready
    { addr = 0x800704B0, name = "func_800704B0" },            # -> phase 6
    { addr = 0x800787F0, name = "func_800787F0" },            # phase 6: wait for the flash, release
    { addr = 0x80070278, name = "func_80070278" },            # release: turn, ability window, phase 7
    { addr = 0x80079030, name = "func_80079030" },            # phase 8: re-cast
    { addr = 0x80078AB4, name = "func_80078AB4" },            # phase 7: the chain/defense timing window
]

# The Zig trial port (pc/docs/porting/battle/TRIAL.md): one subsystem per
# original unit (PORTING.md §20 item 5), the Zig function named by meaning
# (PORTING.md §16) and its views per unit.
[subsystem.battle_146C]
overlay = "battle"
unit = "src/BATTLE/BATTLE.PRG/146C.c"
default = "original"
roots = ["vs_battle_actors", "vs_main_scoredata"]
functions = [
    { addr = 0x8006C004, name = "_updateEnemyKills", zig = "score.updateEnemyKills" },  # a defeated enemy's kills, streak, flags
]

[subsystem.battle_146C.views]
types = ["vs_battle_actor", "vs_battle_actor2", "vs_main_scoredata_t"]
globals = ["vs_main_scoredata"]

[subsystem.battle_44F14]
overlay = "battle"
unit = "src/BATTLE/BATTLE.PRG/44F14.c"
default = "original"
roots = ["D_800F4538", "actorTransformScratch@0x1F80035C"]  # the scratchpad block func_800B07DC works in
functions = [
    { addr = 0x800B07DC, name = "func_800B07DC", zig = "actor_transform.offsetToWorld" },  # scratch offset -> world
]

[subsystem.battle_44F14.views]
types = ["D_800F4538_t", "actorTransformScratch"]
globals = []

[subsystem.battle_5BF94]
overlay = "battle"
unit = "src/BATTLE/BATTLE.PRG/5BF94.c"
default = "original"
roots = ["D_800EB9D8", "vs_battle_textBoxes", "vs_battle_stringContext"]
functions = [
    { addr = 0x800CB2B8, name = "vs_battle_displaySceneMessage", zig = "scene_message.displaySceneMessage" },  # the name window
]

[subsystem.battle_5BF94.views]
types = ["vs_battle_textBox", "vs_battle_stringContext_t", "vs_action_t"]
globals = ["D_800EB9D8", "D_800F4E68", "D_800F4E69", "vs_battle_stringContext", "vs_main_actions",
           "vs_battle_menuStrings", "vs_battle_textBoxes", "D_800EBF58", "D_800EBDDC"]

# The model bake-off (pc/docs/porting/battle/BAKEOFF.md): eleven functions,
# one Zig module each. One subsystem per unit; 146C.c and 5BF94.c get their
# own (`_bakeoff`) beside the trial's, so the trial's corpus suites and their
# root-call gate keep checking exactly the trial's functions.
[subsystem.battle_146C_bakeoff]
overlay = "battle"
unit = "src/BATTLE/BATTLE.PRG/146C.c"
default = "original"
roots = ["D_800F19CC", "vs_battle_actors", "vs_battle_characterState"]
functions = [
    { addr = 0x8006CE50, name = "func_8006CE50", zig = "room_timer.startSection12Timer" },             # the section-12 timer at 180
    { addr = 0x8007C088, name = "func_8007C088", zig = "actor_weapon.isWeaponDrawn" },                 # an actor's weapon-drawn bit
    { addr = 0x8007357C, name = "func_8007357C", zig = "field_menu.enterMenuMode" },                   # vs_battle_exec mode 5
    { addr = 0x8008379C, name = "_factorDamageReceived", zig = "hit_factors.factorDamageReceived" },  # (hp + mp) * statFactor / 10
    { addr = 0x8008D5FC, name = "func_8008D5FC", zig = "room_lock.operateLock" },                      # a lock: queue it or toggle it
    { addr = 0x80074A20, name = "func_80074A20", zig = "actor_defeat.checkDefeated" },                 # an actor at 0 HP falls
    { addr = 0x80078828, name = "func_80078828", zig = "ability_window.canUseBattleAbility" },         # a chain/defense input allowed
    { addr = 0x8006A334, name = "vs_battle_applyWeaponStats", zig = "weapon_stats.applyWeaponStats" }, # weapon parts -> the UI weapon
]

[subsystem.battle_146C_bakeoff.views]
types = ["vs_battle_actor", "vs_battle_actor2", "D_800F19CC_t", "vs_action_t", "_hitEntity_t", "_mpdRoomSectionA",
         "vs_main_settings_t", "vs_battle_uiWeapon", "vs_battle_weaponIntermediate"]
globals = ["vs_battle_actors", "D_800F19CC", "D_800F196C", "_cameraMode", "vs_battle_characterState", "vs_main_settings"]

[subsystem.battle_5BF94_bakeoff]
overlay = "battle"
unit = "src/BATTLE/BATTLE.PRG/5BF94.c"
default = "original"
roots = []
functions = [
    { addr = 0x800CFD60, name = "vs_battle_lerpSvector", zig = "vector_lerp.lerpSvector" },  # three 7-bit lerps into an SVECTOR
]

[subsystem.battle_5BF94_bakeoff.views]
types = ["SVECTOR"]
globals = []

