; rood-boi builder - options
; Open this file in a text editor, change the values, save it, then run ./build-rood-boi.sh

[build]

; Also build the Callo Merlose companion mod ("Two's A Riot"): Merlose joins Ashley
; as an AI party member. You get play-callo.sh next to the normal play.sh.
merlose = yes

; Only with merlose = yes:
; permanent stat-up items always give the maximum, +4, instead of +1 to +4.
max_stat_items = yes
; after a boss, choose your bonus wheel reward (Down/Up, then Circle) instead of spinning.
choosable_bonus_wheel = yes

[advanced]
; Where the source code comes from. Leave these alone unless you know you want another one.
repository = https://github.com/Daemeous/rood-boi.git
branch = callo
