# Waivers of the corpus gates (differ.py), each with its reason. Remove a
# waiver as soon as a recipe makes it unnecessary.
#
# [SUBSYSTEM]: routed functions the selected recipes may leave without root
# calls in call mode (root_call_gate): every other function of the subsystem
# must be called at the root by at least one selected recipe, or the run fails.
#
# [alternate_one_side.SUBSYSTEM]: functions alternate mode may run on one
# side only (alternate_check): it alternates per call, so a function a recipe
# calls once runs owned only; tick mode covers it.

