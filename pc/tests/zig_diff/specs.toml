# Differential specs (pc/tools/zig_diff.py): each ported function, the Zig
# file that builds its inputs, the iterations a CTest run makes, the input
# classes that must all occur, and the mutation self-checks: wrong variants
# of the port (or of a helper it uses) that the harness must catch. A
# mutation whose `from` text is gone fails the check (keep them current).
#
#   file   the file the mutation edits (default: the port's file)
#   target "c": the mutation edits the original C body instead (its `from` copied from the
#          C), checked against a stand-in port that is the C itself (no Zig port needed)
#   expect "mismatch" (default), "panic" or "crash" (a signal in the port's run)
#
# zig_diff.py --coverage also gates on the coverage lane (branches of the original covered by
# the spec's inputs; no boundary-equality or sign-only value flag). A gap the spec cannot or
# should not close is waived with its reason:
#   [[function.F.coverage_waiver]]  id = "+38 b1" (as the report prints it), reason = "..."

