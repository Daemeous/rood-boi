# Which suites a change can affect: python3 pc/tests/run.py --changed [BASE]
# (pc/tests/affected.py reads this; BASE defaults to main). verify.sh's quick
# lane (the default before a publish) runs this selection on Vulkan, the [quick]
# extras below, and nothing else; verify.sh --full runs every suite on every
# renderer, once a day.
#
# The changed files are the tracked ones only: the commits since BASE (git diff
# BASE...HEAD, or BASE..HEAD when BASE is a published snapshot with no shared
# history) plus uncommitted edits to tracked files. Untracked files never count,
# and [ignore] drops tool folders even if they get tracked.
#
# Each file is matched against the tables below (fnmatch patterns on the
# repository path: `*` also crosses `/`). A file selects the union of the
# suites of every rule it matches; suite entries are run.py names, fnmatch
# patterns of them ("ui_*", "input:*") or "@set" for a [sets] entry.
#
#   [core]        files every suite runs through: they select the broad set
#                 (@broad), a cross-section of the game, never every suite
#   [[rule]]      paths -> suites; `suites = []` means "nothing to run";
#                 `exclusive = true` skips the import scan for these paths
#   [baseline]    suites added whenever any file that goes into the game
#                 binary changes (game or port source, shaders, assets)
#   [default]     what a file no rule covers selects, with a warning to add a
#                 rule here (never the full suite: that is verify.sh --full)
#   [quick]       the quick lane's fixed extras and the GL renderer's files
#   [[long]]      suites too slow for the quick lane unless a change touches them
#
# Besides the table, three things are derived, so they never go stale:
#   - a test script (pc/tests/*.py, *.sh) selects the suites that run it or
#     import it (transitively): changing editor_selection_smoke.py also runs
#     editor_handles_smoke, which imports it; a module more than
#     [shared].max_importers suites import selects @broad instead;
#   - a pc/tools/*.py module imported by test scripts selects those suites;
#   - a file named in pc/CMakeLists.txt (a probe or the sources it compiles)
#     and pc/tests/*_probe.* select ctest.

[ignore]
# Tool folders (agent worktrees, symlinks to other disks): never part of a change.
paths = [".kameosa/*", ".kameosa", ".claude/*", ".claude", ".kameosa-*", ".worktrees/*", ".cache/*", ".venv/*"]

[sets]
# A cross-section of the game, one or two suites per subsystem, all short
# (seconds to a minute each): boot and RPC, the title and opening, a room, a
# scene, field play into battle, menus and saves, 2D text, widescreen, Lua,
# the lighting path, the editor, snapshots, the CTest probes.
broad = ["rpc_smoke", "golden_frames", "room_smoke", "opening_smoke", "scene_smoke", "title_fade_smoke",
         "snapshot_equivalence", "input:start-through-the-opening", "input:start-select-in-battle",
         "ui_menus_smoke", "save_menu_smoke", "widescreen_smoke", "ui_text_smoke", "lua_smoke", "gi_smoke",
         "emissive_smoke", "animation_smoke", "damage_numbers_smoke", "tunables_smoke", "editor_selection_smoke",
         "ctest"]
# What every frame goes through (the scaled VRAM target, native meshes, 2D,
# post, presentation): the suites that compare pictures of each kind.
render = ["golden_frames", "room_smoke", "opening_smoke", "scene_smoke", "title_fade_smoke", "transition_fade_smoke",
          "widescreen_smoke", "widescreen_scene_smoke", "interpolation_smoke", "coplanar_order_smoke",
          "flipped_sprite_smoke", "ui_text_smoke", "ui_lines_smoke", "ui_upscale_smoke", "text_fade_smoke",
          "hud_label_solid_smoke", "aa_smoke", "post_smoke", "gi_smoke", "emissive_smoke", "material_smoke",
          "texture_animation_smoke", "photo_full_room_smoke", "rpc_smoke"]
# The test harness itself: the selector, verify.sh's argv, checkpoints and
# save states, and a few game suites run through it end to end.
harness = ["affected_test", "verify_args_test", "checkpoints_test", "snapshot_equivalence", "rpc_smoke",
           "room_smoke", "opening_smoke", "null_backend_smoke"]
# A file no rule covers: the builds (verify.sh always runs them), the null
# backend, the probes and a few broad smokes.
default = ["null_backend_smoke", "rpc_smoke", "room_smoke", "opening_smoke", "golden_frames", "ctest"]

[shared]
# A test module imported by more suites than this (rood_rpc.py: 144,
# checkpoints.py: 117, menu_nav.py, golden_frames.py) selects @broad instead
# of all its importers: any of them would notice a broken helper.
max_importers = 30
suites = ["@broad"]

[core]
# Code every suite runs through. A break here shows in any suite, so the broad
# set finds it; the daily full verify covers the rest. Each group says why.
paths = [
    # the RPC client and the checkpoint/snapshot helpers every game suite drives the game with
    "pc/tools/rood_rpc.py", "pc/tests/checkpoints.py", "pc/tests/snapshot_diff.py",
    # what generates parts of the game binary (types, shaders): every suite runs that binary
    "pc/tools/build_boot.py", "pc/tools/import_types.py", "pc/tools/gl_shaders.py", "pc/tools/vk_shaders.py",
    # the decomp's shared build inputs: the main executable's splat config, SDK and game headers
    "Makefile", "config/splat.config.yaml", "config/SLUS_010.40/*", "include/*", "pc/include/*",
    # vendored libraries every run links (SDL, the PS1 library reimplementations)
    "pc/third_party/SDL3/*", "pc/third_party/psycross/*", "pc/third_party/psycross-audio/*",
    # the runtime: guest memory, the boot path, the SDK shims, the disc, the window, save states
    "pc/src/boot_runtime.c", "pc/src/boot_sdk.c", "pc/src/boot_window.c", "pc/src/boot_*.inc",
    "pc/src/snapshot.*", "pc/src/memory.*", "pc/src/overlay_statics.c", "pc/src/psx_*", "pc/src/platform.h",
    "pc/src/win_compat.h", "pc/src/pc_paths.h", "pc/src/cd_drive.c",
    # the game's main executable and headers, shared by every scene
    "src/SLUS_010.40/*", "src/include/*", "src/GIM/*", "src/renderTextures.h",
]
suites = ["@broad"]

[baseline]
# Cheap guards that the game still boots, plays and draws like before, added
# for any change to what the game is built from or loads.
paths = ["pc/src/*", "src/*", "pc/shaders/*", "pc/assets/*", "lighting/*"]
suites = ["rpc_smoke", "golden_frames"]

[default]
suites = ["@default"]

[quick]
# verify.sh's quick lane. Vulkan runs the selection plus `vulkan`; the null
# renderer runs its CPU-safe share of it plus `null`; GL runs `gl_sanity`
# (boot and RPC, a room, the opening, the goldens, the title's 2D) plus what
# the files in `gl_paths` (the OpenGL renderer's own code) select.
vulkan = ["ctest"]
null = ["null_backend_smoke"]
gl_sanity = ["rpc_smoke", "room_smoke", "opening_smoke", "golden_frames", "title_fade_smoke"]
gl_paths = ["pc/src/gl_*", "pc/src/render_gl.h", "pc/src/post_gl.inc", "pc/src/gpu_hw.c", "pc/src/render.c",
            "pc/src/*_gl.*", "pc/tools/gl_shaders.py"]

# ---- long suites (Vulkan times of the last full verify): the quick lane runs
# one only when its own script or declared sources change, or a file in its
# `paths` (what it exists to test) does ----
[[long]]
# zig_diff's ten shards, the coverage lane and the port pipeline: ~35 min of CPU
suites = ["ctest_long"]
paths = ["game/*", "pc/tools/zig_diff.py", "pc/tools/zig_views.py", "pc/tools/zig_c.py", "pc/tools/ownership.py",
         "pc/tools/battle_statics.py", "pc/tests/zig_diff/*", "pc/tests/zig_diff_coverage_test.py"]

[[long]]
# 431 s and 128 s: the charge skip played out
suites = ["skip_charging_smoke", "charge_skip_soak"]
paths = ["pc/src/charge_skip.*"]

[[long]]
# 3000 vsyncs of play each
suites = ["soak", "soak:save"]
paths = []

[[long]]
# 180 s: every room's emissive glows and generated window lights
suites = ["emissive_catalog"]
paths = ["pc/assets/emissive/*", "pc/tools/generate_lighting.py", "lighting/default/generated/*"]

[[long]]
# the story viewer: every chapter's scenes (900 s budget)
suites = ["cutscene_viewer_smoke"]
paths = ["pc/src/cutscene*", "pc/src/story_boot.c", "pc/assets/cutscenes/*", "pc/tools/story_*.py",
         "pc/tools/cutscene_*.py"]

[[long]]
# 126 s: the data menu five times, then a walk
suites = ["input:data-menu-five-times-then-walk"]
paths = ["pc/src/memory_card.c", "src/MENU/*"]

[[long]]
# the Zig trial port's corpus runs (~100 s each, six of them): run in the null lane
suites = ["trial_corpus_*"]
paths = ["game/*", "pc/tests/diff/*", "pc/tools/field_map.py", "pc/src/shadow.*", "pc/docs/porting/battle/MEANINGS.tsv"]

