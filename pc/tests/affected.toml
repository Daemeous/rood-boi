         "pc/tools/new_worktree.sh", "pc/tools/remove_worktree.sh", "pc/tools/clean_build.py",
         "pc/tests/profile_report.py", "pc/tests/enemy_soak_report.py", "pc/run-game.sh", "pc/run-boot.sh",
         "assets/*"]
suites = []

