# Which suites a change can affect: python3 pc/tests/run.py --changed [BASE]
# (pc/tests/affected.py reads this; BASE defaults to main).
#
# Every changed file (git diff BASE, plus uncommitted and untracked files) is
# matched against the rules below (fnmatch patterns on the repository path:
# `*` also crosses `/`). A file selects the union of the suites of every rule
# it matches; suite entries are run.py names or fnmatch patterns of them
# ("ui_*", "input:*").
#
#   [core]        a match runs everything (renderer core, the runtime, RPC,
#                 snapshots, the test harness itself)
#   [[rule]]      paths -> suites; `suites = []` means "nothing to run"
#   [baseline]    suites added whenever any file that goes into the game
#                 binary changes (game or port source, shaders, assets)
#
# Besides the table, three things are derived, so they never go stale:
#   - a test script (pc/tests/*.py, *.sh) selects the suites that run it or
#     import it (transitively): changing editor_selection_smoke.py also runs
#     editor_handles_smoke, which imports it;
#   - a pc/tools/*.py module imported by test scripts selects those suites;
#   - a file named in pc/CMakeLists.txt (a probe or the sources it compiles)
#     and pc/tests/*_probe.* select ctest.
# A file that matches nothing at all runs everything: when in doubt, add a
# rule here rather than guessing in code.

[core]
paths = [
    "pc/tests/run.py", "pc/tests/affected.py", "pc/tests/affected.toml", "pc/tests/checkpoints.py",
    "pc/tools/rood_rpc.py", "pc/tools/build_boot.py", "pc/tools/build_cache.py", "pc/tools/import_types.py",
    "pc/tools/gl_shaders.py", "pc/tools/vk_shaders.py", "pc/tools/nrd.py", "pc/tools/nrd/*",
    "pc/tools/snapshot_layout.py", "pc/tools/shared_cache.py",
    "pc/CMakeLists.txt", "Makefile", "requirements.txt", "config/*", "include/*", "tools/*", ".gitmodules",
    "pc/third_party/*", "pc/include/*",
    # the runtime, guest memory, RPC, snapshots, the window and the shared renderer
    "pc/src/boot_runtime.c", "pc/src/boot_sdk.c", "pc/src/boot_window.c", "pc/src/boot_*.inc",
    "pc/src/dev_rpc.c", "pc/src/dev_state.*", "pc/src/dev_overlay.cpp", "pc/src/snapshot.*",
    "pc/src/memory.*", "pc/src/overlay_statics.c", "pc/src/psx_*", "pc/src/platform.h", "pc/src/win_compat.h",
    "pc/src/pc_paths.h", "pc/src/cd_drive.c", "pc/src/audio*", "pc/src/project_settings.cpp",
    "pc/src/gpu_hw.c", "pc/src/render.*", "pc/src/render_gl.h", "pc/src/gl_api.h", "pc/src/gl_present.c",
    "pc/src/scene_submit.inc", "pc/src/scene_capture.*", "pc/src/room_native.c", "pc/src/room_render.c", "pc/src/room_editor.h",
    "pc/src/room_geometry.c", "pc/src/room_callbacks.inc", "pc/src/actor_*", "pc/src/battle_*",
    "pc/src/vk_core.*", "pc/src/vk_hw.*", "pc/src/vk_hooks.h", "pc/src/vk_present.c", "pc/src/vk_render.inc",
    "pc/src/vk_overlay.cpp", "pc/src/input_record.c", "pc/src/navigation.c", "pc/src/materials.*",
    "pc/shaders/vulkan/hw*", "pc/shaders/vulkan/native*", "pc/shaders/vulkan/vram.glsl",
    "pc/shaders/vulkan/upload.*", "pc/shaders/vulkan/present_vram.frag", "pc/shaders/vulkan/fullscreen.vert",
    "pc/shaders/vulkan/scaled.frag", "pc/shaders/vulkan/downsample.*", "pc/shaders/vulkan/brightness.*",
    # the game itself, shared by every scene
    "src/SLUS_010.40/*", "src/include/*", "src/GIM/*", "src/renderTextures.h",
]

[baseline]
# Cheap guards that the game still boots, plays and draws like before, added
# for any change to what the game is built from or loads.
paths = ["pc/src/*", "src/*", "pc/shaders/*", "pc/assets/*", "lighting/*"]
suites = ["rpc_smoke", "golden_frames"]

