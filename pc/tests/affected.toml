[[rule]]
paths = ["src/TITLE/*", "config/TITLE/*"]
suites = ["title_fade_smoke", "skip_intro_smoke", "opening_smoke", "input:*", "snapshot_equivalence",
          "interp_menu_2d_smoke", "widescreen_smoke", "save_menu_smoke", "movie_smoke"]

[[rule]]
paths = ["src/ENDING/*", "config/ENDING/*"]
suites = ["ending_smoke"]

# ---- the small overlays' split config (no source of their own here) ----
[[rule]]
paths = ["config/SMALL/*", "config/GIM/*"]
suites = ["@broad"]

# ---- the editor ----
[[rule]]
paths = ["pc/src/editor_*", "pc/src/library_*", "pc/src/selection*", "pc/src/floor_grid.*",
         "pc/assets/editor/*", "pc/src/lighting_editor.cpp", "pc/src/particles_editor.cpp",
         "pc/src/fixture_editor.cpp", "pc/src/emissive_editor.cpp"]
suites = ["editor_*", "barn_doors_smoke", "emissive_entries_smoke", "emissive_tools_smoke", "light_actors_smoke", "ctest"]

[[rule]]
paths = ["pc/src/emissive*", "pc/assets/emissive/*", "pc/assets/materials/*", "pc/assets/materials/masters/*", "pc/shaders/vulkan/emissive.glsl",
         "pc/tools/check_material_maps.py", "pc/src/window_pattern*", "pc/shaders/vulkan/window_pattern*"]
suites = ["emissive_smoke", "emissive_entries_smoke", "emissive_tools_smoke", "emissive_metadata", "editor_selection_smoke", "editor_undo_smoke",
          "editor_schema_smoke", "editor_inspect_smoke", "material_smoke", "material_relief_smoke", "material_survey_smoke",
          "material_catalog", "material_instances_smoke", "material_palette_anim_smoke",
          "emissive_palette_anim_smoke"]

# Shader hot reload (pc/docs/Vulkan_Renderer.md "Hot reload"): the in-process compiler.
[[rule]]
paths = ["pc/src/shader_compiler.*", "pc/src/vk_shader_lookup.*", "pc/shaders/vulkan/*", "pc/tools/vk_shaders.py"]
suites = ["shader_compiler", "shader_reload_smoke"]

# Shader hot reload's service, the pipelines it replaces (vk_core.c), its RPC and banner.
[[rule]]
paths = ["pc/src/shader_reload.*", "pc/src/vk_core.*"]
suites = ["shader_reload_smoke", "shader_compiler"]

# Material response (pc/docs/Materials.md): the catalog, the editor, the shading and reflections.
[[rule]]
paths = ["pc/src/material*", "pc/shaders/vulkan/material*", "pc/shaders/vulkan/rt_reflect*",
         "pc/shaders/vulkan/rt_paths.glsl", "pc/tools/material_survey.py"]
suites = ["material_smoke", "material_relief_smoke", "material_survey_smoke", "material_catalog", "emissive_smoke", "gi_smoke",
          "material_instances_smoke", "material_review_smoke", "material_baked_smoke", "editor_inspect_smoke",
          "material_palette_anim_smoke"]

# The catalog's rect_light entries feed the window-light generator as well as
# runtime emissive masks. The validator declares both inputs in run.py sources
# (including the generator's transitive imports); exercise their rendered lights too.
[[rule]]
paths = ["pc/assets/emissive/catalog.json", "pc/tools/generate_lighting.py"]
suites = ["emissive_smoke", "fixture_lighting_smoke", "light_actors_smoke"]

# Generated window lights are read by emissive_catalog's per-room budget check.
[[rule]]
paths = ["lighting/default/generated/*"]
suites = ["emissive_catalog"]

# ---- lights, lighting packs, fixtures, prefabs ----
[[rule]]
paths = ["pc/src/light*", "pc/src/lights*", "pc/src/fixture_*", "pc/src/glow*", "pc/src/glows.c",
         "pc/src/room_lighting.c", "pc/src/room_settings.cpp", "pc/src/room_effects.*", "pc/src/menu_light*",
         "pc/assets/fixtures/*", "pc/assets/prefabs/*", "pc/shaders/vulkan/light_shape.glsl",
         "pc/shaders/vulkan/rt_lights.glsl", "pc/shaders/vulkan/shadow.*"]
suites = ["light_actors_smoke", "fixture_lighting_smoke", "lighting_presets_smoke", "sky_smoke",
          "glow_stability_smoke", "save_point_glow_smoke", "barn_doors_smoke", "gi_smoke", "texture_animation_smoke",
          "room_browser_smoke", "editor_selection_smoke", "editor_schema_smoke", "editor_handles_smoke",
          "editor_undo_smoke", "platform_shadow_smoke", "lighting_lint", "ctest"]

[[rule]]
paths = ["lighting/*", "pc/tools/lighting_*.py", "pc/tools/generate_lighting.py", "pc/tools/fixture_*.py",
         "pc/tools/estimate_lights.py", "pc/tools/outdoor.py"]
suites = ["lighting_lint", "fixture_lighting_smoke", "light_actors_smoke", "sky_smoke", "atmosphere_smoke",
          "glow_stability_smoke", "save_point_glow_smoke", "room_browser_smoke", "ctest"]

[[rule]]
paths = ["pc/src/lighting_quality.*"]
suites = ["lighting_presets_smoke", "gi_smoke", "probe_gi_smoke", "ui_system_smoke", "system_settings_smoke"]

# ---- global illumination, ray tracing, shadows (NRD's build helper too) ----
[[rule]]
paths = ["pc/src/ptgi.c", "pc/src/probe_*", "pc/src/vk_rt.inc", "pc/src/vk_probes.inc", "pc/src/vk_nrd.*",
         "pc/src/vk_shadows.c", "pc/src/shadows.c", "pc/src/room_shadows.inc", "pc/shaders/vulkan/rt_*",
         "pc/shaders/vulkan/probe_*", "pc/shaders/vulkan/menu_studio.glsl", "pc/tools/nrd.py", "pc/tools/nrd/*"]
suites = ["gi_smoke", "probe_gi_smoke", "nrd_smoke", "rt_camera_smoke", "gi_lag_smoke", "sky_smoke",
          "lighting_presets_smoke", "emissive_smoke", "ui_ashley_*", "platform_shadow_smoke",
          "save_point_glow_smoke", "barn_doors_smoke", "light_actors_smoke", "camera_stick_smoke"]

# ---- atmosphere, fog, sky ----
[[rule]]
paths = ["pc/src/atmosphere*", "pc/src/environment*", "pc/src/fog_sim*", "pc/src/vk_fogvol.inc",
         "pc/assets/environment/*", "pc/shaders/vulkan/fog*", "pc/shaders/vulkan/medium.glsl",
         "pc/shaders/vulkan/environment.glsl", "pc/tools/atmosphere_sweep.py"]
suites = ["atmosphere_smoke", "atmosphere_sweep", "void_fog_smoke", "fog_sim_smoke", "fog_volume_smoke", "sky_smoke",
          "tunables_smoke",
          "widescreen_scene_smoke", "editor_selection_smoke", "editor_schema_smoke", "transition_fade_smoke"]

# ---- particles ----
[[rule]]
paths = ["pc/src/particle*", "pc/src/vk_particles.inc", "pc/assets/emitters/*", "pc/shaders/vulkan/particles*"]
suites = ["particles_smoke", "ctest"]

# ---- post-processing, anti-aliasing ----
[[rule]]
paths = ["pc/src/post*", "pc/src/post_*.inc", "pc/assets/post/*", "pc/shaders/vulkan/bloom*",
         "pc/shaders/vulkan/post_*", "pc/shaders/vulkan/blur.frag", "pc/shaders/vulkan/dof*"]
suites = ["post_smoke", "dof_smoke", "dof_subject_smoke", "dof_loading_smoke", "aa_smoke", "transition_fade_smoke", "tunables_smoke"]

[[rule]]
paths = ["pc/src/antialias.*", "pc/shaders/vulkan/smaa*", "pc/shaders/vulkan/fxaa.frag",
         "pc/shaders/vulkan/aa_geometry.glsl", "pc/shaders/vulkan/ms_*", "pc/third_party/smaa/*"]
suites = ["aa_smoke", "ui_lines_smoke", "ui_text_smoke", "post_smoke", "flipped_sprite_smoke"]

# ---- 2D: text, fonts, bubbles, prompts, upscaling ----
[[rule]]
paths = ["pc/src/ui_text.*", "pc/src/fixed_font.c", "pc/src/text_lines.c", "pc/src/ui_labels.h",
         "pc/shaders/vulkan/text_*"]
suites = ["text_fade_smoke", "ui_text_smoke", "hud_label_solid_smoke", "damage_numbers_smoke", "button_prompts_smoke",
          "button_roles_symbols_smoke", "ui_manual_smoke", "ui_score_smoke", "ctest", "classic_hud_smoke"]

[[rule]]
paths = ["pc/src/ui_bubbles.*", "pc/src/ui_emotes.c"]
suites = ["ui_lines_smoke", "ui_text_smoke", "interp_menu_2d_smoke", "opening_smoke", "scene_smoke"]

[[rule]]
paths = ["pc/src/ui_upscale*", "pc/shaders/vulkan/ui_mmpx.comp"]
suites = ["ui_upscale_smoke", "flipped_sprite_smoke", "ui_text_smoke"]

[[rule]]
paths = ["pc/src/button_prompts.*", "pc/src/prompt_glyphs.cpp"]
suites = ["button_prompts_smoke", "button_roles_symbols_smoke", "ui_manual_smoke", "fast_travel_smoke", "tunables_smoke"]

[[rule]]
paths = ["pc/src/button_roles.c"]
suites = ["button_roles_smoke", "button_roles_symbols_smoke", "input:*", "ui_menus_smoke"]

[[rule]]
paths = ["pc/src/widescreen.h"]
suites = ["widescreen_*", "interp_menu_2d_smoke", "ui_map_smoke", "ui_manual_smoke", "ui_score_smoke",
          "ui_ashley_smoke", "title_fade_smoke", "narrowed_2d_smoke"]

# ---- controls, camera ----
[[rule]]
paths = ["pc/tests/send_key.c", "pc/tests/send_mouse.c"]
suites = ["input:*", "window_smoke"]

[[rule]]
paths = ["pc/src/boot_controller.*", "pc/src/boot_gamepad.c"]
suites = ["input:*", "window_smoke", "system_settings_smoke", "camera_stick_smoke", "button_prompts_smoke", "ctest"]

[[rule]]
paths = ["pc/src/camera_stick.*"]
suites = ["camera_stick_smoke", "camera_options_smoke", "facing_cutaway_smoke", "ctest"]

# ---- rooms, warps, fast travel ----
[[rule]]
paths = ["pc/src/room_browser.cpp", "pc/src/room_warp.*", "pc/src/room_catalog.c", "pc/src/screff2_warp.c",
         "pc/src/map_view.c"]
suites = ["room_browser_smoke", "room_entry_sound_smoke", "editor_roomload_smoke", "fast_travel_*", "atmosphere_sweep", "void_fog_smoke",
          "two_model_enemy_smoke", "platform_shadow_smoke", "ui_map_smoke", "narrowed_2d_smoke", "cutscene_viewer_smoke",
          "ctest"]

[[rule]]
paths = ["pc/src/fast_travel*", "pc/tools/fast_travel_scan.py"]
suites = ["fast_travel_*", "ctest"]

# ---- saves, weapons, movies ----
[[rule]]
paths = ["pc/src/memory_card.c"]
suites = ["save_menu_smoke", "ui_data_smoke", "ui_container_smoke", "replace_file_test", "fast_travel_smoke",
          "weapon_slots_smoke", "snapshot_equivalence", "input:data-menu*", "ctest"]

[[rule]]
paths = ["pc/src/weapon_slots.c", "pc/src/weapon_packets.c"]
suites = ["weapon_slots_smoke", "animation_smoke", "ui_equip_smoke", "ui_ashley_*", "tunables_smoke"]

[[rule]]
paths = ["pc/src/mdec.c", "pc/src/xa_audio.c"]
suites = ["movie_smoke", "skip_intro_smoke", "ctest"]

# ---- LP64 tools ----
[[rule]]
paths = ["pc/tools/lp64_*.py", "pc/tools/decl_mismatch.py", "pc/tools/psx_ptr_codemod.py"]
suites = ["lp64_alias_scan"]

# ---- tools no test uses (a test that imports one is found by the import scan) ----
[[rule]]
paths = ["pc/tools/aa_bench.py", "pc/tools/anim_trace.py", "pc/tools/font_match.py", "pc/tools/inventory.py",
         "pc/tools/manual_dump.py", "pc/tools/lighting_gallery.py", "pc/tools/windows_dist.py",
         "pc/tools/event_callbacks.py"]
suites = ["ctest"]

[[rule]]
paths = ["pc/src/material_graph.*", "pc/assets/materials/nodes/**", "pc/assets/materials/masters/**",
         "pc/shaders/vulkan/material_graph.glsl", "pc/plugins/rood.material_graph/**"]
suites = ["material_graph_smoke", "material_instances_smoke", "shader_reload_smoke"]
